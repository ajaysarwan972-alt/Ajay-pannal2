<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Result Chart</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.market-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:15px;
}

.market-btn{
    padding:13px 8px;
    border:none;
    border-radius:8px;
    background:#0057d8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.market-btn.active{
    background:#ff9800;
}

.result-box{
    background:white;
    margin:0 15px 20px;
    border-radius:10px;
    overflow:hidden;
}

.market-title{
    background:#0057d8;
    color:white;
    padding:13px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#ffcc00;
    padding:10px;
    border:1px solid #ccc;
}

td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

.loading{
    text-align:center;
    padding:20px;
}

.message{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="top">
Result Chart
</div>


<!-- MARKET BUTTONS -->

<div
id="marketButtons"
class="market-buttons">

</div>


<!-- RESULT -->

<div
id="resultBox"
class="result-box"
style="display:none;">

<div
id="marketTitle"
class="market-title">

</div>


<table>

<thead>

<tr>
<th>DATE</th>
<th>RESULT</th>
</tr>

</thead>

<tbody
id="resultBody">

</tbody>

</table>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ======================================
// SUPABASE
// ======================================

const client = supabase.createClient(

"https://katbdbzoufiblnnsoxkk.supabase.co",

"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// ======================================
// MARKET NAMES
// ======================================
//
// Yahan sirf display names change karna.
// Database columns market1...market10
// same rahenge.
//

const markets = [

    {
        column:"market1",
        name:"MARKET 1"
    },

    {
        column:"market2",
        name:"MARKET 2"
    },

    {
        column:"market3",
        name:"MARKET 3"
    },

    {
        column:"market4",
        name:"MARKET 4"
    },

    {
        column:"market5",
        name:"MARKET 5"
    },

    {
        column:"market6",
        name:"MARKET 6"
    },

    {
        column:"market7",
        name:"MARKET 7"
    },

    {
        column:"market8",
        name:"MARKET 8"
    },

    {
        column:"market9",
        name:"MARKET 9"
    },

    {
        column:"market10",
        name:"MARKET 10"
    }

];


// ======================================
// CREATE BUTTONS
// ======================================

function createButtons(){

    const container =
        document.getElementById(
            "marketButtons"
        );


    container.innerHTML = "";


    markets.forEach(function(market,index){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "market-btn";


        button.innerText =
            market.name;


        button.onclick =
            function(){

                showMarket(
                    market,
                    button
                );

            };


        container.appendChild(
            button
        );

    });

}


// ======================================
// SHOW MARKET RESULT
// ======================================

async function showMarket(
    market,
    clickedButton
){

    // Active button

    document
        .querySelectorAll(
            ".market-btn"
        )
        .forEach(function(button){

            button.classList.remove(
                "active"
            );

        });


    clickedButton.classList.add(
        "active"
    );


    const box =
        document.getElementById(
            "resultBox"
        );


    const title =
        document.getElementById(
            "marketTitle"
        );


    const body =
        document.getElementById(
            "resultBody"
        );


    box.style.display =
        "block";


    title.innerText =
        market.name;


    body.innerHTML = `

        <tr>

            <td colspan="2"
                class="loading">

                Loading...

            </td>

        </tr>

    `;


    // ==================================
    // GET ONLY SELECTED MARKET
    // ==================================

    const selectColumn =
        "date," + market.column;


    const {
        data,
        error
    } = await client

        .from("results_chart")

        .select(
            selectColumn
        )

        .not(
            market.column,
            "is",
            null
        )

        .order(
            "date",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        body.innerHTML = `

            <tr>

                <td colspan="2"
                    class="message">

                    ${error.message}

                </td>

            </tr>

        `;

        return;

    }


    if(!data || data.length === 0){

        body.innerHTML = `

            <tr>

                <td colspan="2"
                    class="message">

                    No Result Found

                </td>

            </tr>

        `;

        return;

    }


    // ==================================
    // CREATE RESULT ROWS
    // ==================================

    let html = "";


    data.forEach(function(row){

        html += `

        <tr>

            <td>
                ${row.date}
            </td>

            <td>
                ${row[market.column] || ""}
            </td>

        </tr>

        `;

    });


    body.innerHTML =
        html;

}


// ======================================
// START
// ======================================

createButtons();

</script>


</body>

</html>
