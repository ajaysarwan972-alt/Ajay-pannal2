<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Result Chart</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.buttons{
    padding:15px;
}

.market-btn{
    display:block;
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    background:#0057d8;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.market-btn:hover{
    background:#0045ad;
}

</style>
</head>

<body>

<div class="top">
Result Chart
</div>

<div class="buttons" id="marketButtons">
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = supabase.createClient(

"https://katbdbzoufiblnnsoxkk.supabase.co",

"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// =====================================
// MARKET COLUMNS
// =====================================

const markets = [

    {
        column:"market1",
        name:"MARKET 1"
    },

    {
        column:"market2",
        name:"MARKET 2"
    },

    {
        column:"market3",
        name:"MARKET 3"
    },

    {
        column:"market4",
        name:"MARKET 4"
    },

    {
        column:"market5",
        name:"MARKET 5"
    },

    {
        column:"market6",
        name:"MARKET 6"
    },

    {
        column:"market7",
        name:"MARKET 7"
    },

    {
        column:"market8",
        name:"MARKET 8"
    },

    {
        column:"market9",
        name:"MARKET 9"
    },

    {
        column:"market10",
        name:"MARKET 10"
    }

];


// =====================================
// CREATE BUTTONS
// =====================================

function createButtons(){

    const box =
        document.getElementById(
            "marketButtons"
        );


    markets.forEach(function(market){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "market-btn";


        button.innerText =
            market.name;


        button.onclick =
            function(){

                window.location.href =
                    "selectmarket.html?market=" +
                    encodeURIComponent(
                        market.column
                    ) +
                    "&name=" +
                    encodeURIComponent(
                        market.name
                    );

            };


        box.appendChild(
            button
        );

    });

}


createButtons();

</script>

</body>

</html>
