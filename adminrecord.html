
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Chart</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.box{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    background:#0057d8;
    color:white;
    font-size:18px;
    border-radius:7px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.status{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.table-box{
    overflow-x:auto;
    margin:15px;
}

table{
    width:100%;
    min-width:600px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#ffcc00;
    padding:10px;
    border:1px solid #ccc;
}

td{
    border:1px solid #ddd;
    text-align:center;
    padding:9px;
}

.delete{
    background:red;
    width:auto;
    padding:7px 12px;
    margin:0;
    font-size:14px;
}

</style>

</head>


<body>


<div class="top">
Admin Result Panel
</div>


<!-- RESULT FORM -->

<div class="box">


<!-- DATE -->

<select id="date">

<option value="">
Select Date
</option>

</select>


<!-- MARKET -->

<select id="market">

<option value="">
Loading Market...
</option>

</select>


<!-- RESULT -->

<input
type="text"
id="result"
maxlength="2"
placeholder="Enter Result">


<!-- SUBMIT -->

<button
id="submitBtn"
onclick="saveResult()">

SUBMIT

</button>


</div>


<div id="status"
class="status">
</div>


<!-- SAVED RESULTS -->

<h3 style="text-align:center;">
Saved Results
</h3>


<div class="table-box">

<table>

<thead>

<tr>

<th>ID</th>
<th>Date</th>
<th>Market</th>
<th>Result</th>
<th>Created At</th>
<th>Action</th>

</tr>

</thead>


<tbody id="resultBody">

</tbody>

</table>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// =====================================
// SUPABASE
// =====================================

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// =====================================
// DATE DROPDOWN
// =====================================

const dateSelect =
document.getElementById("date");


for(let i = 1; i <= 31; i++){

    dateSelect.innerHTML += `

        <option value="${i}">
            ${i}
        </option>

    `;

}


// =====================================
// LOAD MARKET FROM login.name
// =====================================

async function loadMarkets(){

    const marketSelect =
    document.getElementById("market");


    const { data, error } =

        await client
        .from("Game result")
        .select("name");


    if(error){

        console.error(error);

        marketSelect.innerHTML = `

            <option value="">
                Market Load Error
            </option>

        `;

        document.getElementById("status").innerText =
            "Market load error: " + error.message;

        return;
    }


    marketSelect.innerHTML = `

        <option value="">
            Select Market
        </option>

    `;


    let markets = [];


    data.forEach(row => {

        let name =
        String(row.name || "").trim();


        if(
            name !== "" &&
            !markets.includes(name)
        ){

            markets.push(name);

        }

    });


    markets.forEach(name => {

        marketSelect.innerHTML += `

            <option value="${name}">
                ${name}
            </option>

        `;

    });


    document.getElementById("status").innerText =
        markets.length + " market loaded.";

}


// =====================================
// SAVE RESULT
// =====================================

async function saveResult(){

    const date =
    document.getElementById("date").value;


    const market =
    document.getElementById("market").value;


    const result =
    document.getElementById("result").value.trim();


    // CHECK DATE

    if(date === ""){

        alert("Date select karo.");

        return;
    }


    // CHECK MARKET

    if(market === ""){

        alert("Market select karo.");

        return;
    }


    // CHECK RESULT

    if(result === ""){

        alert("Result enter karo.");

        return;
    }


    // ONLY 1 OR 2 DIGIT

    if(!/^[0-9]{1,2}$/.test(result)){

        alert(
            "Result sirf 1 ya 2 digit ka hona chahiye."
        );

        return;
    }


    const button =
    document.getElementById("submitBtn");


    button.disabled = true;

    button.innerText =
        "Saving...";


    // =================================
    // INSERT INTO results_chart
    // =================================

    const { data, error } =

        await client
        .from("results_chart")
        .insert({

            date: Number(date),

            market: market,

            result: result

        })
        .select();


    button.disabled = false;

    button.innerText =
        "SUBMIT";


    // ERROR

    if(error){

        console.error(error);

        document.getElementById("status").innerText =
            "ERROR: " + error.message;

        alert(
            "Supabase Error:\n\n" +
            error.message
        );

        return;
    }


    // SUCCESS

    document.getElementById("result").value = "";


    document.getElementById("status").innerText =
        "Result successfully saved in results_chart.";


    alert(
        "Result Supabase mein save ho gaya."
    );


    // REFRESH TABLE

    loadResults();

}


// =====================================
// LOAD RESULTS
// =====================================

async function loadResults(){

    const body =
    document.getElementById("resultBody");


    body.innerHTML = `

        <tr>

            <td colspan="6">
                Loading...
            </td>

        </tr>

    `;


    const { data, error } =

        await client
        .from("results_chart")
        .select("*")
        .order("id", {
            ascending:false
        });


    if(error){

        console.error(error);

        body.innerHTML = `

            <tr>

                <td colspan="6">

                    ERROR:
                    ${error.message}

                </td>

            </tr>

        `;

        return;
    }


    if(!data || data.length === 0){

        body.innerHTML = `

            <tr>

                <td colspan="6">
                    No Results Found
                </td>

            </tr>

        `;

        return;
    }


    let html = "";


    data.forEach(row => {

        html += `

        <tr>

            <td>
                ${row.id ?? ""}
            </td>

            <td>
                ${row.date ?? ""}
            </td>

            <td>
                ${row.market ?? ""}
            </td>

            <td>
                ${row.result ?? ""}
            </td>

            <td>
                ${row.created_at ?? ""}
            </td>

            <td>

                <button
                class="delete"
                onclick="deleteResult(${row.id})">

                    Delete

                </button>

            </td>

        </tr>

        `;

    });


    body.innerHTML = html;

}


// =====================================
// DELETE RESULT
// =====================================

async function deleteResult(id){

    const ok =
    confirm(
        "Kya ye result delete karna hai?"
    );


    if(!ok){

        return;
    }


    const { error } =

        await client
        .from("results_chart")
        .delete()
        .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Delete Error:\n\n" +
            error.message
        );

        return;
    }


    loadResults();

}


// =====================================
// START
// =====================================

loadMarkets();

loadResults();


</script>


</body>

</html>
```
