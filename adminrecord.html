```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Chart</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.box{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    background:#0057d8;
    color:white;
    font-size:18px;
    border-radius:7px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.table-box{
    overflow-x:auto;
    margin:15px;
}

table{
    width:100%;
    min-width:600px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#ffcc00;
    padding:10px;
    border:1px solid #ccc;
}

td{
    border:1px solid #ddd;
    text-align:center;
    padding:9px;
}

.delete{
    background:red;
    width:auto;
    margin:0;
    padding:7px 12px;
    font-size:14px;
}

#status{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="top">
Admin Result Panel
</div>


<!-- =========================
     RESULT ENTRY
========================= -->

<div class="box">


<!-- DATE -->

<select id="date">

<option value="">
Select Date
</option>

</select>


<!-- MARKET FROM login.name -->

<select id="market">

<option value="">
Loading Markets...
</option>

</select>


<!-- RESULT -->

<input
type="text"
id="result"
maxlength="2"
placeholder="Enter Result">


<!-- SUBMIT -->

<button id="submitBtn"
onclick="submitResult()">

SUBMIT

</button>


</div>


<div id="status">
</div>


<!-- =========================
     SAVED RESULTS
========================= -->

<h3 style="text-align:center;">
Saved Results
</h3>


<div class="table-box">

<table>

<thead>

<tr>

<th>ID</th>

<th>Date</th>

<th>Market</th>

<th>Result</th>

<th>Created At</th>

<th>Action</th>

</tr>

</thead>


<tbody id="recordBody">

</tbody>

</table>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE CONNECTION
// ==========================================

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// ==========================================
// DATE DROPDOWN
// ==========================================

const dateSelect =
document.getElementById("date");


for(let i = 1; i <= 31; i++){

    dateSelect.innerHTML += `

        <option value="${i}">
            ${i}
        </option>

    `;

}


// ==========================================
// LOAD MARKET FROM login.name
// ==========================================

async function loadMarkets(){

    const marketSelect =
    document.getElementById("market");


    marketSelect.innerHTML = `

        <option value="">
            Loading Markets...
        </option>

    `;


    const { data, error } =

        await client
        .from("login")
        .select("name");


    if(error){

        console.error(error);

        marketSelect.innerHTML = `

            <option value="">
                Market load error
            </option>

        `;

        document.getElementById("status").innerText =
            "Market load nahi hua.";

        return;
    }


    marketSelect.innerHTML = `

        <option value="">
            Select Market
        </option>

    `;


    let markets = [];


    data.forEach(row => {

        let name =
        String(row.name || "").trim();


        if(
            name !== "" &&
            !markets.includes(name)
        ){

            markets.push(name);

        }

    });


    markets.forEach(name => {

        marketSelect.innerHTML += `

            <option value="${escapeHtml(name)}">
                ${escapeHtml(name)}
            </option>

        `;

    });


    document.getElementById("status").innerText =
        markets.length + " market loaded.";

}


// ==========================================
// HTML SAFE TEXT
// ==========================================

function escapeHtml(value){

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ==========================================
// SUBMIT RESULT
// ==========================================

async function submitResult(){

    const date =
    document.getElementById("date").value;


    const market =
    document.getElementById("market").value;


    const result =
    document.getElementById("result").value.trim();


    // DATE CHECK

    if(!date){

        alert("Date select karo.");

        return;
    }


    // MARKET CHECK

    if(!market){

        alert("Market select karo.");

        return;
    }


    // RESULT CHECK

    if(!result){

        alert("Result enter karo.");

        return;
    }


    // RESULT 2 DIGIT CHECK

    if(!/^\d{1,2}$/.test(result)){

        alert("Result 1 ya 2 digit ka hona chahiye.");

        return;
    }


    const button =
    document.getElementById("submitBtn");


    button.disabled = true;

    button.innerText =
        "Saving...";


    // ======================================
    // SAVE / UPDATE results_chart
    // ======================================

    const { data, error } =

        await client

        .from("results_chart")

        .upsert(

            {
                date: Number(date),

                market: market,

                result: result
            },

            {
                onConflict: "date,market"
            }

        );


    button.disabled = false;

    button.innerText =
        "SUBMIT";


    // ERROR

    if(error){

        console.error(error);

        alert(
            "Result save nahi hua:\n\n" +
            error.message
        );

        return;
    }


    // SUCCESS

    document.getElementById("result").value = "";


    document.getElementById("status").innerText =
        "Result Supabase mein save ho gaya.";


    alert(
        "Result successfully saved!"
    );


    // TABLE REFRESH

    loadResults();

}


// ==========================================
// LOAD results_chart
// ==========================================

async function loadResults(){

    const body =
    document.getElementById("recordBody");


    body.innerHTML = `

        <tr>

            <td colspan="6">
                Loading...
            </td>

        </tr>

    `;


    const { data, error } =

        await client

        .from("results_chart")

        .select("*")

        .order("date", {
            ascending:true
        });


    if(error){

        console.error(error);


        body.innerHTML = `

            <tr>

                <td colspan="6">

                    ${escapeHtml(error.message)}

                </td>

            </tr>

        `;

        return;
    }


    if(!data || data.length === 0){

        body.innerHTML = `

            <tr>

                <td colspan="6">
                    No Result Found
                </td>

            </tr>

        `;

        return;
    }


    let html = "";


    data.forEach(row => {

        html += `

        <tr>

            <td>
                ${escapeHtml(row.id ?? "")}
            </td>


            <td>
                ${escapeHtml(row.date ?? "")}
            </td>


            <td>
                ${escapeHtml(row.market ?? "")}
            </td>


            <td>
                ${escapeHtml(row.result ?? "")}
            </td>


            <td>
                ${escapeHtml(row.created_at ?? "")}
            </td>


            <td>

                <button

                    class="delete"

                    onclick="deleteResult(${row.id})">

                    Delete

                </button>

            </td>

        </tr>

        `;

    });


    body.innerHTML = html;

}


// ==========================================
// DELETE RESULT
// ==========================================

async function deleteResult(id){

    const confirmDelete =
    confirm(
        "Kya aap ye result delete karna chahte ho?"
    );


    if(!confirmDelete){

        return;
    }


    const { error } =

        await client

        .from("results_chart")

        .delete()

        .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Result delete nahi hua:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "Result delete ho gaya."
    );


    loadResults();

}


// ==========================================
// START
// ==========================================

loadMarkets();

loadResults();


</script>


</body>

</html>
```
