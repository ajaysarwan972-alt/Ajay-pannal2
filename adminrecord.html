<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Result Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.box{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

.date-box{
    background:#eee;
    padding:13px;
    border-radius:8px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:17px;
    margin-bottom:15px;
}

input{
    text-align:center;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#0057d8;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.status{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.table-box{
    overflow-x:auto;
    margin:15px;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#ffcc00;
    padding:10px;
    border:1px solid #ccc;
}

td{
    border:1px solid #ddd;
    padding:9px;
    text-align:center;
}

</style>
</head>


<body>


<div class="top">
Admin Result Panel
</div>


<div class="box">

<h3>Enter Result</h3>


<!-- DATE -->

<div class="date-box">

Date:
<span id="currentDate">
Loading...
</span>

</div>


<!-- MARKET DROPDOWN -->

<label>
Select Market
</label>

<select id="marketSelect">

<option value="">
Select Market
</option>

<option value="gzbd">
gzbd
</option>

<option value="market2">
MARKET 2
</option>

<option value="market3">
MARKET 3
</option>

<option value="market4">
MARKET 4
</option>

<option value="market5">
MARKET 5
</option>

<option value="market6">
MARKET 6
</option>

<option value="market7">
MARKET 7
</option>

<option value="market8">
MARKET 8
</option>

<option value="market9">
MARKET 9
</option>

<option value="market10">
MARKET 10
</option>

</select>


<!-- RESULT -->

<label>
Result
</label>

<input
type="text"
id="resultInput"
maxlength="2"
inputmode="numeric"
placeholder="Enter Result">


<!-- SUBMIT -->

<button
id="submitBtn"
onclick="saveResult()">

SUBMIT RESULT

</button>

</div>


<div
id="status"
class="status">
</div>


<!-- SAVED DATA -->

<h3 style="text-align:center;">
Saved Results
</h3>


<div class="table-box">

<table>

<thead>

<tr>

<th>Date</th>
<th>gzbd</th>
<th>Market 2</th>
<th>Market 3</th>
<th>Market 4</th>
<th>Market 5</th>
<th>Market 6</th>
<th>Market 7</th>
<th>Market 8</th>
<th>Market 9</th>
<th>Market 10</th>

</tr>

</thead>

<tbody id="resultBody">

</tbody>

</table>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ======================================
// SUPABASE
// ======================================

const client = supabase.createClient(

"https://katbdbzoufiblnnsoxkk.supabase.co",

"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// ======================================
// INDIA DATE
// DATE CHANGE AT 1 AM
// ======================================

function getCurrentDate(){

    const now = new Date();

    const india = new Date(
        now.toLocaleString(
            "en-US",
            {
                timeZone:"Asia/Kolkata"
            }
        )
    );


    // 1 AM se pehle previous date

    if(india.getHours() < 1){

        india.setDate(
            india.getDate() - 1
        );

    }


    const year =
        india.getFullYear();

    const month =
        String(
            india.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            india.getDate()
        ).padStart(2,"0");


    return year + "-" + month + "-" + day;

}


// ======================================
// SHOW DATE
// ======================================

function showDate(){

    document.getElementById(
        "currentDate"
    ).innerText =
        getCurrentDate();

}


// ======================================
// LOAD TODAY'S DATA
// ======================================

async function loadToday(){

    const date =
        getCurrentDate();


    const {
        data,
        error
    } = await client

        .from("results_chart")

        .select(
            "id,date,market1,market2,market3,market4,market5,market6,market7,market8,market9,market10"
        )

        .eq("date",date)

        .maybeSingle();


    if(error){

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "Load Error: " +
            error.message;

        return;

    }


    // Agar aaj ki row hai

    if(data){

        window.todayData =
            data;

    }else{

        window.todayData =
            null;

    }


    loadTable();

}


// ======================================
// MARKET CHANGE
// ======================================

document.getElementById(
    "marketSelect"
).addEventListener(
    "change",
    function(){

        const market =
            this.value;


        const input =
            document.getElementById(
                "resultInput"
            );


        if(
            market &&
            window.todayData
        ){

            input.value =
                window.todayData[market] || "";

        }else{

            input.value = "";

        }

    }
);


// ======================================
// SAVE RESULT
// ======================================

async function saveResult(){

    const date =
        getCurrentDate();


    const market =
        document.getElementById(
            "marketSelect"
        ).value;


    const result =
        document.getElementById(
            "resultInput"
        ).value.trim();


    // MARKET CHECK

    if(!market){

        alert(
            "Market select karo."
        );

        return;

    }


    // RESULT CHECK

    if(result === ""){

        alert(
            "Result enter karo."
        );

        return;

    }


    // ONLY 1 OR 2 DIGIT

    if(!/^[0-9]{1,2}$/.test(result)){

        alert(
            "Result 1 ya 2 digit ka hona chahiye."
        );

        return;

    }


    const button =
        document.getElementById(
            "submitBtn"
        );


    button.disabled = true;

    button.innerText =
        "SAVING...";


    // ==================================
    // CHECK TODAY ROW
    // ==================================

    const {
        data: existing,
        error: checkError
    } = await client

        .from("results_chart")

        .select("id")

        .eq("date",date)

        .maybeSingle();


    if(checkError){

        console.error(checkError);

        alert(
            "Check Error:\n\n" +
            checkError.message
        );

        button.disabled = false;

        button.innerText =
            "SUBMIT RESULT";

        return;

    }


    let response;


    // ==================================
    // EXISTING ROW = UPDATE
    // ==================================

    if(existing){

        response =
            await client

            .from("results_chart")

            .update({

                [market]: result

            })

            .eq(
                "id",
                existing.id
            );

    }


    // ==================================
    // NEW ROW = INSERT
    // ==================================

    else{

        response =
            await client

            .from("results_chart")

            .insert({

                date: date,

                [market]: result

            });

    }


    button.disabled = false;

    button.innerText =
        "SUBMIT RESULT";


    // ERROR

    if(response.error){

        console.error(
            response.error
        );

        alert(
            "Supabase Error:\n\n" +
            response.error.message
        );

        return;

    }


    alert(
        "Result save ho gaya."
    );


    document.getElementById(
        "resultInput"
    ).value = "";


    // Reload data

    await loadToday();


    // Selected market ka latest value

    if(window.todayData){

        const {
            data
        } = await client

            .from("results_chart")

            .select(
                "market1,market2,market3,market4,market5,market6,market7,market8,market9,market10"
            )

            .eq("date",date)

            .maybeSingle();


        if(data){

            window.todayData =
                data;

        }

    }

}


// ======================================
// LOAD TABLE
// ======================================

async function loadTable(){

    const body =
        document.getElementById(
            "resultBody"
        );


    body.innerHTML = `

        <tr>

            <td colspan="11">
                Loading...
            </td>

        </tr>

    `;


    const {
        data,
        error
    } = await client

        .from("results_chart")

        .select(
            "date,market1,market2,market3,market4,market5,market6,market7,market8,market9,market10"
        )

        .order(
            "date",
            {
                ascending:false
            }
        );


    if(error){

        body.innerHTML = `

            <tr>

                <td colspan="11">
                    ${error.message}
                </td>

            </tr>

        `;

        return;

    }


    if(!data || data.length === 0){

        body.innerHTML = `

            <tr>

                <td colspan="11">
                    No Results Found
                </td>

            </tr>

        `;

        return;

    }


    let html = "";


    data.forEach(row => {

        html += `

        <tr>

            <td>
                ${row.date || ""}
            </td>

            <td>
                ${row.gzbd || ""}
            </td>

            <td>
                ${row.market2 || ""}
            </td>

            <td>
                ${row.market3 || ""}
            </td>

            <td>
                ${row.market4 || ""}
            </td>

            <td>
                ${row.market5 || ""}
            </td>

            <td>
                ${row.market6 || ""}
            </td>

            <td>
                ${row.market7 || ""}
            </td>

            <td>
                ${row.market8 || ""}
            </td>

            <td>
                ${row.market9 || ""}
            </td>

            <td>
                ${row.market10 || ""}
            </td>

        </tr>

        `;

    });


    body.innerHTML =
        html;

}


// ======================================
// AUTOMATIC DATE CHECK
// ======================================

let oldDate =
    getCurrentDate();


setInterval(function(){

    const newDate =
        getCurrentDate();


    if(newDate !== oldDate){

        oldDate =
            newDate;


        showDate();


        document.getElementById(
            "marketSelect"
        ).value = "";


        document.getElementById(
            "resultInput"
        ).value = "";


        loadToday();

    }

},30000);


// ======================================
// START
// ======================================

showDate();

loadToday();


</script>

</body>
</html>
