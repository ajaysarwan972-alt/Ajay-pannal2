<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Chart</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.top{
    background:#0057d8;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.box{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    background:#0057d8;
    color:white;
    font-size:18px;
    border-radius:7px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.date-box{
    background:#eee;
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.status{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.table-box{
    overflow-x:auto;
    margin:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#ffcc00;
    padding:10px;
    border:1px solid #ccc;
}

td{
    border:1px solid #ddd;
    text-align:center;
    padding:9px;
}

</style>

</head>


<body>


<div class="top">
Admin Result Panel
</div>


<div class="box">

<!-- CURRENT DATE -->

<label>Current Date</label>

<div class="date-box" id="currentDate">
Loading...
</div>


<!-- MARKET -->

<label>Market</label>

<select id="market">

<option value="">
Loading Markets...
</option>

</select>


<!-- RESULT -->

<label>Result</label>

<input
type="text"
id="result"
maxlength="2"
inputmode="numeric"
placeholder="Enter Result">


<!-- SUBMIT -->

<button
id="submitBtn"
onclick="saveResult()">

SUBMIT

</button>

</div>


<div id="status" class="status"></div>


<!-- SAVED RESULTS -->

<h3 style="text-align:center;">
Today's Results
</h3>


<div class="table-box">

<table>

<thead>

<tr>
<th>Date</th>
<th>Market</th>
<th>Result</th>
</tr>

</thead>

<tbody id="resultBody">

</tbody>

</table>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ============================================
// SUPABASE CONNECTION
// ============================================

const client = supabase.createClient(

"https://katbdbzoufiblnnsoxkk.supabase.co",

"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// ============================================
// DATE
// ============================================

// Date 1:00 AM par change hogi.

function getCurrentDate(){

    const now = new Date();

    // India time
    const indiaTime = new Date(
        now.toLocaleString(
            "en-US",
            {
                timeZone:"Asia/Kolkata"
            }
        )
    );


    // Agar 1 AM se pehle hai
    // to previous calendar date use hogi

    if(indiaTime.getHours() < 1){

        indiaTime.setDate(
            indiaTime.getDate() - 1
        );

    }


    const year =
        indiaTime.getFullYear();

    const month =
        String(
            indiaTime.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            indiaTime.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


// ============================================
// SHOW CURRENT DATE
// ============================================

function showDate(){

    const date =
        getCurrentDate();

    document.getElementById(
        "currentDate"
    ).innerText = date;

}


// ============================================
// LOAD MARKET
// FROM results_chart.market
// ============================================

async function loadMarkets(){

    const marketSelect =
        document.getElementById("market");


    const { data, error } =

        await client
        .from("results_chart")
        .select("market");


    if(error){

        console.error(error);

        marketSelect.innerHTML = `

        <option value="">
            Market Load Error
        </option>

        `;

        document.getElementById(
            "status"
        ).innerText =
            "Market load error: " +
            error.message;

        return;
    }


    marketSelect.innerHTML = `

        <option value="">
            Select Market
        </option>

    `;


    let markets = [];


    data.forEach(row => {

        const name =
            String(
                row.market || ""
            ).trim();


        // Empty aur duplicate market hatao

        if(
            name !== "" &&
            !markets.includes(name)
        ){

            markets.push(name);

        }

    });


    markets.forEach(name => {

        const option =
            document.createElement(
                "option"
            );

        option.value = name;

        option.textContent = name;

        marketSelect.appendChild(
            option
        );

    });


    document.getElementById(
        "status"
    ).innerText =
        markets.length +
        " market loaded.";

}


// ============================================
// SAVE RESULT
// ============================================

async function saveResult(){

    const date =
        getCurrentDate();


    const market =
        document.getElementById(
            "market"
        ).value;


    const result =
        document.getElementById(
            "result"
        ).value.trim();


    // Check market

    if(!market){

        alert(
            "Market select karo."
        );

        return;
    }


    // Check result

    if(!result){

        alert(
            "Result enter karo."
        );

        return;
    }


    // Result only 1-2 digit

    if(!/^[0-9]{1,2}$/.test(result)){

        alert(
            "Result 1 ya 2 digit ka hona chahiye."
        );

        return;
    }


    const button =
        document.getElementById(
            "submitBtn"
        );


    button.disabled = true;

    button.innerText =
        "Saving...";


    // ========================================
    // INSERT INTO results_chart
    // ========================================

    const { data, error } =

        await client
        .from("results_chart")
        .insert({

            date: date,

            market: market,

            result: result

        })
        .select();


    button.disabled = false;

    button.innerText =
        "SUBMIT";


    if(error){

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "ERROR: " +
            error.message;

        alert(
            "Supabase Error:\n\n" +
            error.message
        );

        return;
    }


    // Clear result

    document.getElementById(
        "result"
    ).value = "";


    alert(
        "Result successfully saved."
    );


    document.getElementById(
        "status"
    ).innerText =
        "Result saved in results_chart.";


    loadResults();

}


// ============================================
// LOAD TODAY'S RESULTS
// ============================================

async function loadResults(){

    const today =
        getCurrentDate();


    const body =
        document.getElementById(
            "resultBody"
        );


    body.innerHTML = `

        <tr>

            <td colspan="3">
                Loading...
            </td>

        </tr>

    `;


    const { data, error } =

        await client
        .from("results_chart")
        .select("date,market,result")
        .eq("date", today)
        .order("market");


    if(error){

        console.error(error);

        body.innerHTML = `

        <tr>

            <td colspan="3">

                ${error.message}

            </td>

        </tr>

        `;

        return;
    }


    if(!data || data.length === 0){

        body.innerHTML = `

        <tr>

            <td colspan="3">
                Aaj ka koi result nahi hai.
            </td>

        </tr>

        `;

        return;
    }


    let html = "";


    data.forEach(row => {

        html += `

        <tr>

            <td>
                ${row.date}
            </td>

            <td>
                ${row.market}
            </td>

            <td>
                ${row.result}
            </td>

        </tr>

        `;

    });


    body.innerHTML = html;

}


// ============================================
// AUTOMATIC DATE CHECK
// ============================================

let lastDate =
    getCurrentDate();


setInterval(() => {

    const newDate =
        getCurrentDate();


    if(newDate !== lastDate){

        lastDate = newDate;


        showDate();

        loadResults();

    }

}, 30000);


// ============================================
// START
// ============================================

showDate();

loadMarkets();

loadResults();


</script>


</body>

</html>
