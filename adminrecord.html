<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE
// ==========================================

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


// ==========================================
// INDIA DATE
// DATE CHANGES AT 1:00 AM
// ==========================================

function getCurrentDate(){

    const now = new Date();


    const india = new Date(

        now.toLocaleString(
            "en-US",
            {
                timeZone:"Asia/Kolkata"
            }
        )

    );


    /*
       1 AM se pehle previous date
       1 AM ke baad current date
    */

    if(india.getHours() < 1){

        india.setDate(
            india.getDate() - 1
        );

    }


    const year =
        india.getFullYear();


    const month =
        String(
            india.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            india.getDate()
        ).padStart(2,"0");


    return year + "-" + month + "-" + day;

}


// ==========================================
// SHOW DATE
// ==========================================

function showDate(){

    document.getElementById(
        "currentDate"
    ).innerText =
        getCurrentDate();

}


// ==========================================
// LOAD TODAY'S RESULT
// ==========================================

async function loadToday(){

    const date =
        getCurrentDate();


    const { data, error } =

        await client

        .from("results_chart")

        .select(
            "id,date,market1,market2,market3,market4,market5,market6,market7,market8,market9,market10"
        )

        .eq("date", date)

        .maybeSingle();


    if(error){

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "Load Error: " +
            error.message;

        return;

    }


    // Agar aaj ka data already hai

    if(data){

        for(let i = 1; i <= 10; i++){

            document.getElementById(
                "market" + i
            ).value =
                data["market" + i] || "";

        }

    }


    loadTable();

}


// ==========================================
// SAVE RESULT
// ==========================================

async function saveResult(){

    const date =
        getCurrentDate();


    const values = {};


    // 10 markets ka data

    for(let i = 1; i <= 10; i++){

        const value =
            document.getElementById(
                "market" + i
            ).value.trim();


        // Empty allowed hai

        if(value !== ""){

            // Sirf 1 ya 2 digit

            if(!/^[0-9]{1,2}$/.test(value)){

                alert(
                    "Market " +
                    i +
                    " ka result galat hai."
                );

                return;

            }

        }


        values["market" + i] =
            value === "" ? null : value;

    }


    const button =
        document.getElementById(
            "submitBtn"
        );


    button.disabled = true;

    button.innerText =
        "SAVING...";


    // ======================================
    // PEHLE CHECK KARO KI DATE KI ROW HAI YA NAHI
    // ======================================

    const {
        data: existing,
        error: checkError
    } =

        await client

        .from("results_chart")

        .select("id")

        .eq("date", date)

        .maybeSingle();


    if(checkError){

        console.error(checkError);

        alert(
            "Check Error:\n\n" +
            checkError.message
        );

        button.disabled = false;

        button.innerText =
            "SUBMIT RESULT";

        return;

    }


    let response;


    // ======================================
    // EXISTING ROW → UPDATE
    // ======================================

    if(existing){

        response =

            await client

            .from("results_chart")

            .update(values)

            .eq("id", existing.id);

    }


    // ======================================
    // NEW DATE → INSERT
    // ======================================

    else{

        response =

            await client

            .from("results_chart")

            .insert({

                date:date,

                ...values

            });

    }


    button.disabled = false;

    button.innerText =
        "SUBMIT RESULT";


    // ======================================
    // ERROR
    // ======================================

    if(response.error){

        console.error(
            response.error
        );

        document.getElementById(
            "status"
        ).innerText =
            "ERROR: " +
            response.error.message;

        alert(
            "Supabase Error:\n\n" +
            response.error.message
        );

        return;

    }


    // ======================================
    // SUCCESS
    // ======================================

    document.getElementById(
        "status"
    ).innerText =
        "Result saved successfully.";


    alert(
        "Result save ho gaya."
    );


    loadTable();

}


// ==========================================
// LOAD SAVED RESULTS
// ==========================================

async function loadTable(){

    const body =
        document.getElementById(
            "resultBody"
        );


    body.innerHTML = `

        <tr>

            <td colspan="11">
                Loading...
            </td>

        </tr>

    `;


    const {
        data,
        error
    } =

        await client

        .from("results_chart")

        .select(
            "date,market1,market2,market3,market4,market5,market6,market7,market8,market9,market10"
        )

        .order(
            "date",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        body.innerHTML = `

            <tr>

                <td colspan="11">
                    ${error.message}
                </td>

            </tr>

        `;

        return;

    }


    if(!data || data.length === 0){

        body.innerHTML = `

            <tr>

                <td colspan="11">
                    No Results Found
                </td>

            </tr>

        `;

        return;

    }


    let html = "";


    data.forEach(row => {

        html += `

        <tr>

            <td>
                ${row.date || ""}
            </td>

            <td>
                ${row.market1 || ""}
            </td>

            <td>
                ${row.market2 || ""}
            </td>

            <td>
                ${row.market3 || ""}
            </td>

            <td>
                ${row.market4 || ""}
            </td>

            <td>
                ${row.market5 || ""}
            </td>

            <td>
                ${row.market6 || ""}
            </td>

            <td>
                ${row.market7 || ""}
            </td>

            <td>
                ${row.market8 || ""}
            </td>

            <td>
                ${row.market9 || ""}
            </td>

            <td>
                ${row.market10 || ""}
            </td>

        </tr>

        `;

    });


    body.innerHTML =
        html;

}


// ==========================================
// CHECK DATE EVERY 30 SECONDS
// ==========================================

let oldDate =
    getCurrentDate();


setInterval(function(){

    const newDate =
        getCurrentDate();


    if(newDate !== oldDate){

        oldDate =
            newDate;


        showDate();


        // Purane result boxes clear

        for(let i = 1; i <= 10; i++){

            document.getElementById(
                "market" + i
            ).value = "";

        }


        loadToday();

    }

},30000);


// ==========================================
// START
// ==========================================

showDate();

loadToday();


</script>
