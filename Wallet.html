<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:30px;
}

/* ================= HEADER ================= */

.header{
  height:100px;
  background:#d9a92f;
  display:flex;
  align-items:center;
  padding:0 18px;
  color:white;
  position:relative;
}

.backBtn{
  font-size:34px;
  cursor:pointer;
  width:50px;
}

.headerTitle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:24px;
  font-weight:bold;
}

/* ================= MAIN ================= */

.main{
  padding:20px 14px;
}

/* ================= USER CARD ================= */

.userCard{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
  text-align:center;
}

.userLabel{
  color:#777;
  font-size:15px;
  margin-bottom:8px;
}

.userId{
  font-size:20px;
  font-weight:bold;
  word-break:break-all;
}

/* ================= WALLET CARD ================= */

.walletCard{
  background:#11151e;
  border-radius:25px;
  padding:30px 20px;
  color:white;
  text-align:center;
  box-shadow:0 6px 15px rgba(0,0,0,.20);
}

.walletIcon{
  font-size:45px;
  margin-bottom:10px;
}

.walletTitle{
  color:#ccc;
  font-size:18px;
  margin-bottom:12px;
}

.balance{
  font-size:40px;
  font-weight:bold;
  color:#f0cf55;
}

.balanceLabel{
  color:#aaa;
  margin-top:8px;
  font-size:14px;
}

/* ================= INFO ================= */

.infoBox{
  background:white;
  border-radius:18px;
  margin-top:18px;
  padding:18px;
  box-shadow:0 4px 10px rgba(0,0,0,.10);
}

.infoRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.infoRow:last-child{
  border-bottom:0;
}

.infoName{
  color:#777;
}

.infoValue{
  font-weight:bold;
}

/* ================= HOME BUTTON ================= */

.homeBtn{
  width:100%;
  margin-top:20px;
  padding:17px;
  border:0;
  border-radius:18px;
  background:#d9a92f;
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:40px 10px;
  color:#777;
}

.error{
  background:#ffe0e0;
  color:#b00000;
  padding:15px;
  border-radius:15px;
  text-align:center;
  display:none;
  margin-bottom:15px;
}

/* ================= MOBILE ================= */

@media(max-width:360px){

  .header{
    height:90px;
  }

  .headerTitle{
    font-size:21px;
  }

  .walletCard{
    padding:25px 15px;
  }

  .balance{
    font-size:34px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div
    class="backBtn"
    onclick="goHome()">
    ‹
  </div>

  <div class="headerTitle">
    My Wallet
  </div>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

  <!-- Error -->

  <div
    class="error"
    id="errorBox">
  </div>


  <!-- Loading -->

  <div
    class="loading"
    id="loading">
    Wallet loading...
  </div>


  <!-- Wallet Content -->

  <div
    id="walletContent"
    style="display:none;">


    <!-- User -->

    <div class="userCard">

      <div class="userLabel">
        User ID
      </div>

      <div
        class="userId"
        id="userId">
        -
      </div>

    </div>


    <!-- Wallet -->

    <div class="walletCard">

      <div class="walletIcon">
        💰
      </div>

      <div class="walletTitle">
        Available Balance
      </div>

      <div
        class="balance"
        id="balance">
        ₹0
      </div>

      <div class="balanceLabel">
        Current Wallet Balance
      </div>

    </div>


    <!-- Information -->

    <div class="infoBox">

      <div class="infoRow">

        <div class="infoName">
          Account ID
        </div>

        <div
          class="infoValue"
          id="accountId">
          -
        </div>

      </div>


      <div class="infoRow">

        <div class="infoName">
          Wallet Status
        </div>

        <div
          class="infoValue"
          id="walletStatus">
          Active
        </div>

      </div>

    </div>


    <!-- Home -->

    <button
      class="homeBtn"
      onclick="goHome()">

      🏠 Home

    </button>

  </div>

</div>


<script>

/* ================= SUPABASE ================= */

const client = supabase.createClient(

  "https://katbdbzoufiblnnsoxkk.supabase.co",

  "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* ================= LOGIN CHECK ================= */

const user =
  JSON.parse(
    localStorage.getItem("user")
  );


if(!user){

  window.location.href =
    "index.html";

}


/* ================= LOAD WALLET ================= */

async function loadWallet(){

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("walletContent");

  const errorBox =
    document.getElementById("errorBox");


  try{

    if(!user || !user.id){

      throw new Error(
        "User login information not found."
      );

    }


    /*
      login table se current
      logged-in user ki information
      read ki ja rahi hai.
    */

    const { data, error } =
      await client

        .from("login")

        .select("id,balance")

        .eq("id",user.id)

        .single();


    if(error){

      throw error;

    }


    if(!data){

      throw new Error(
        "User wallet information not found."
      );

    }


    /* ================= DISPLAY ================= */

    document.getElementById(
      "userId"
    ).innerText =
      data.id;


    document.getElementById(
      "accountId"
    ).innerText =
      data.id;


    document.getElementById(
      "balance"
    ).innerText =
      "₹" + (
        data.balance ?? 0
      );


    loading.style.display =
      "none";


    content.style.display =
      "block";


  }catch(error){

    console.error(error);


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.innerText =
      "Wallet load nahi ho saka.";

  }

}


/* ================= HOME ================= */

function goHome(){

  window.location.href =
    "index.html";

}


/* ================= START ================= */

loadWallet();

</script>

</body>
          </html>
