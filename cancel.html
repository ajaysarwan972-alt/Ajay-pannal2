      content="width=device-width, initial-scale=1.0">

<title>Cancel Transaction</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#e5e7eb;
    padding:15px;
}

h2{
    text-align:center;
    margin-top:5px;

}

select,
input{
    width:100%;

}

    display:flex;
    justify-content:space-between;

}

    text-align:right;
    word-break:break-word;
}

    width:100%;

    transform:scale(.98);
}

}

    border-radius:15px;

</head>


<body>

<h2>Cancel Transaction</h2>


<div class="box">

    <label>Select ID</label>

    <select
        id="userSelect"
        onchange="showUserInfo()">

        <option value="">
            Loading User IDs...
        </option>

    </select>


    <div
        id="userInfo"
        class="userInfo">

        <div>
            <b>Name:</b>
            <span id="userName">-</span>
        </div>

        <div>
            <b>Mobile:</b>
            <span id="userMobile">-</span>
        </div>

        <div>
            <b>Balance:</b>
            ₹ <span id="userBalance">0</span>
        </div>

    </div>


    <label>Select Date</label>

    <input
        type="date"
        id="dateSelect">


    <button
        class="showBtn"
        onclick="loadHistory()">

        SHOW HISTORY

    </button>

</div>


<div id="historyList">

    <div class="empty">
        Select ID and Date
    </div>

</div>


<script>


// ==================================================
// SUPABASE CONNECTION
// ==================================================

const SUPABASE_URL =
    "https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==================================================
// LOAD USERS
// ==================================================

async function loadUsers(){

    const select =
        document.getElementById("userSelect");


    select.innerHTML =
        '<option value="">Loading IDs...</option>';


    const { data, error } =

        await client

        .from("login")

        .select("id,name,mobile,balance")

        .order("id");


    console.log("LOGIN DATA:", data);

    console.log("LOGIN ERROR:", error);


    if(error){

        select.innerHTML =
            '<option value="">ID Load Error</option>';


        document.getElementById("historyList")
            .innerHTML = `

            <div class="errorBox">

                <b>Supabase Error</b>

                <br><br>

                ${error.message}

            </div>

            `;

        return;
    }


    select.innerHTML =
        '<option value="">Select User ID</option>';


    if(!data || data.length === 0){

        select.innerHTML =
            '<option value="">No Users Found</option>';

        return;
    }


    data.forEach(user => {

        const option =
            document.createElement("option");


        option.value =
            user.id;


        option.textContent =
            user.id;


        option.dataset.name =
            user.name ?? "";


        option.dataset.mobile =
            user.mobile ?? "";


        option.dataset.balance =
            user.balance ?? 0;


        select.appendChild(option);

    });

}


// ==================================================
// SHOW USER INFORMATION
// ==================================================

function showUserInfo(){

    const select =
        document.getElementById("userSelect");


    const info =
        document.getElementById("userInfo");


    if(!select.value){

        info.style.display = "none";

        return;
    }


    const option =
        select.options[select.selectedIndex];


    document.getElementById("userName")
        .textContent =
        option.dataset.name || "-";


    document.getElementById("userMobile")
        .textContent =
        option.dataset.mobile || "-";


    document.getElementById("userBalance")
        .textContent =
        option.dataset.balance || "0";


    info.style.display =
        "block";

}


// ==================================================
// LOAD HISTORY
// ==================================================

async function loadHistory(){

    const userId =
        document.getElementById("userSelect").value;


    const date =
        document.getElementById("dateSelect").value;


    if(!userId){

        alert("Pehle ID select karo.");

        return;
    }


    if(!date){

        alert("Pehle date select karo.");

        return;
    }


    const list =
        document.getElementById("historyList");


    list.innerHTML =
        '<div class="loading">History loading...</div>';


    // ----------------------------------------------
    // START DATE
    // ----------------------------------------------

    const startDate =
        date + " 00:00:00";


    // ----------------------------------------------
    // NEXT DATE
    // ----------------------------------------------

    const parts =
        date.split("-");


    const year =
        Number(parts[0]);


    const month =
        Number(parts[1]) - 1;


    const day =
        Number(parts[2]);


    const nextDay =
        new Date(
            year,
            month,
            day + 1
        );


    const nextDate =

        nextDay.getFullYear() +

        "-" +

        String(
            nextDay.getMonth() + 1
        ).padStart(2,"0") +

        "-" +

        String(
            nextDay.getDate()
        ).padStart(2,"0") +

        " 00:00:00";


    console.log("Selected ID:",userId);

    console.log("Start:",startDate);

    console.log("Next:",nextDate);


    // ----------------------------------------------
    // GET HISTORY
    // ----------------------------------------------

    const { data, error } =

        await client

        .from("history")

        .select("*")

        .eq(
            "user_id",
            userId
        )

        .gte(
            "created_at",
            startDate
        )

        .lt(
            "created_at",
            nextDate
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    console.log("HISTORY DATA:",data);

    console.log("HISTORY ERROR:",error);


    if(error){

        list.innerHTML = `

            <div class="errorBox">

                <b>History Error</b>

                <br><br>

                ${error.message}

            </div>

        `;

        return;
    }


    showHistory(data);

}


// ==================================================
// SHOW HISTORY
// ==================================================

function showHistory(data){

    const list =
        document.getElementById("historyList");


    list.innerHTML = "";


    if(!data || data.length === 0){

        list.innerHTML = `

            <div class="empty">

                Is ID aur date ki history nahi mili.

            </div>

        `;

        return;
    }


    data.forEach(item => {


        const status =
            item.status || "active";


        const time =
            item.created_at
            ?
            new Date(
                item.created_at
            ).toLocaleString("en-IN")
            :
            "-";


        let action = "";


        if(
            String(status).toLowerCase()
            === "cancelled"
        ){

            action = `

                <div class="cancelled">

                    CANCELLED / REFUNDED

                </div>

            `;

        }else{

            action = `

                <button
                    class="cancelBtn"
                    onclick="cancelTransaction('${item.id}')">

                    CANCEL + REFUND

                </button>

            `;

        }


        list.innerHTML += `

            <div class="history">


                <div class="row">

                    <b>History ID</b>

                    <span>
                        ${item.id ?? "-"}
                    </span>

                </div>


                <div class="row">

                    <b>User ID</b>

                    <span>
                        ${item.user_id ?? "-"}
                    </span>

                </div>


                <div class="row">

                    <b>Market</b>

                    <span>
                        ${item.market ?? "-"}
                    </span>

                </div>


                <div class="row">

                    <b>Total</b>

                    <span>
                        ₹ ${item.total ?? 0}
                    </span>

                </div>


                <div class="row">

                    <b>Mode</b>

                    <span>
                        ${item.mode ?? "-"}
                    </span>

                </div>


                <div class="row">

                    <b>Status</b>

                    <span>
                        ${status}
                    </span>

                </div>


                <div class="row">

                    <b>Time</b>

                    <span>
                        ${time}
                    </span>

                </div>


                ${action}


            </div>

        `;

    });

}


// ==================================================
// CANCEL + REFUND
// ==================================================

async function cancelTransaction(historyId){

    const ok =
        confirm(
            "Is transaction ko cancel karke balance mein refund karna hai?"
        );


    if(!ok){

        return;
    }


    const { data, error } =

        await client.rpc(

            "cancel_demo_transaction",

            {
                p_history_id:
                    historyId
            }

        );


    console.log(
        "RPC DATA:",
        data
    );


    console.log(
        "RPC ERROR:",
        error
    );


    if(error){

        alert(
            "Refund Error:\n\n" +
            error.message
        );

        return;
    }


    if(!data){

        alert(
            "Server se response nahi mila."
        );

        return;
    }


    if(!data.success){

        alert(
            data.message ||
            "Transaction cancel nahi hui."
        );

        return;
    }


    alert(

        "Transaction cancelled successfully.\n\n" +

        "Refund amount: ₹" +

        (data.amount || 0)

    );


    // History refresh
    await loadHistory();


    // Balance refresh
    await refreshUserBalance();

}


// ==================================================
// REFRESH BALANCE
// ==================================================

async function refreshUserBalance(){

    const userId =
        document.getElementById("userSelect").value;


    if(!userId){

        return;
    }


    const { data, error } =

        await client

        .from("login")

        .select("balance")

        .eq(
            "id",
            userId
        )

        .maybeSingle();


    if(error){

        console.log(
            "BALANCE ERROR:",
            error
        );

        return;
    }


    if(data){

        document.getElementById(
            "userBalance"
        ).textContent =
            data.balance ?? 0;

    }

}


// ==================================================
// START
// ==================================================

loadUsers();


</script>

</body>

</html>
```
