<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jodi Game</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#e5e7eb;
padding-bottom:80px;
}

.header{
position:fixed;
top:10px;
left:10px;
right:10px;
background:#fff;
padding:10px;
border-radius:20px;
display:flex;
justify-content:space-between;
z-index:999;
}

#userId{
background:green;
color:#fff;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

#wallet{
background:red;
color:#fff;
padding:6px 12px;
border-radius:20px;
font-size:12px;
}

.frameBox{
margin-top:5px;
width:100%;
height:120px;
}

.frameBox iframe{
width:100%;
height:120px;
border:none;
}

.container{
margin:10px;
background:#fff;
padding:15px;
border-radius:15px;
padding-bottom:150px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.box{
background:#fff;
padding:10px;
border-radius:10px;
text-align:center;
border:1px solid #ddd;
}

input{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

.total{
width:50%;
background:linear-gradient(to right,blue,red);
color:#fff;
text-align:center;
padding:15px;
}

.submit{
width:50%;
background:green;
color:#fff;
text-align:center;
padding:15px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<div id="userId">ID: 0</div>
<div id="wallet">₹ 0</div>
</div>

<div class="frameBox">
<iframe src="header.html"></iframe>
</div>

<div class="container">

<div class="grid" id="jodiGrid">

</div>

</div>

<div class="bottom">
<div class="total" id="total">₹ 0</div>
<div class="submit" onclick="submitAll()">SUBMIT</div>
</div>

<script>

const client=supabase.createClient(
"https://katbdbzoufiblnnsoxkk.supabase.co",
"YOUR_ANON_KEY"
);

const user=JSON.parse(localStorage.getItem("user"));

document.getElementById("userId").innerText="ID: "+user.id;

const market=localStorage.getItem("market")||"UNKNOWN";

let dataArr=[];
let total=0;
  async function loadUser(){

if(!user){
alert("Login Again");
return;
}

let {data}=await client
.from("login")
.select("balance")
.eq("id",user.id)
.single();

if(data){
document.getElementById("wallet").innerText="₹ "+data.balance;
}

}

loadUser();

function updateTotal(){

total=0;

dataArr.forEach(i=>{
total+=i.amount;
});

document.getElementById("total").innerText="₹ "+total;

}

for(let i=0;i<100;i++){

let num=i.toString().padStart(2,"0");

jodiGrid.innerHTML+=`
<div class="box">
${num}
<input
type="number"
oninput="add('${num}',this.value)">
</div>
`;

}

function add(num,val){

val=Number(val)||0;

dataArr=dataArr.filter(x=>x.number!=num);

if(val>0){
dataArr.push({
number:num,
amount:val
});
}

updateTotal();

}

async function submitAll(){

if(dataArr.length==0){
alert("Kuch Add Karo");
return;
}

let {data:userData}=await client
.from("login")
.select("balance")
.eq("id",user.id)
.single();

if(userData.balance<total){

alert("YOUR BALANCE IS LOW GAME CANCEL ❌");

return;

}

await client
.from("login")
.update({
balance:userData.balance-total
})
.eq("id",user.id);

await client
.from("history")
.insert({

user_id:user.id,

market:market,

data:dataArr,

total:total,

created_at:new Date()

});

alert("GAME OK ✅");

await loadUser();

dataArr=[];

total=0;

updateTotal();

document.querySelectorAll("input").forEach(x=>{
x.value="";
});

}

</script>

</body>
</html>
